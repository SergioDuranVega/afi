<h2 class="text-2xl text-center font-bold !mb-5">Calculadoras</h2>

<div class="flex flex-row flex-wrap justify-center items-center gap-4">

    <div *ngFor="let calc of calculadoras" class="text-center max-w-60 !p-6 !bg-white border rounded-lg shadow-sm flex flex-col items-center justify-center gap-2 mb-4">

        <h5 class="mb-2 text-xl font-bold tracking-tight text-gray-900">
            {{ calc.titulo }}
        </h5>

        <p class="font-normal text-gray-700 text-base">
            {{ calc.descripcion }}
        </p>

        <button class="!p-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition cursor-pointer"
            [routerLink]="[calc.ruta]">
            Acceder
        </button>

    </div>

</div>
